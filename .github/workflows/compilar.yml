name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    # Para publicar cada versión en "Releases"
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Quitar archivos del teclado anterior
        run: |
          # Archivos de la versión vieja que ya no existen en la nueva (si quedaron en el repo)
          cd app/src/main/java/com/tecladoios
          rm -fv Claves.kt EmojiPalabras.kt EmojiPanel.kt Formas.kt Idiomas.kt KeyPreview.kt \
            KeyboardCorners.kt Medidas.kt ModeloToque.kt Movimiento.kt Panel.kt SuggestionBar.kt Variantes.kt
          rm -fv ../../../../test/java/com/tecladoios/PortapapelesYEmojisTest.kt

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ampliar el diccionario con el español que se usa de verdad
        run: |
          # Lista completa de palabras del español conversado con su frecuencia (subtítulos).
          # Entran las que faltan (también las formales y del trabajo), en el lugar que les toca,
          # sin los errores de tipeo. Sin internet el diccionario queda como está.
          BASE=https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/es
          if curl -fsSL -o frecuencias.txt "$BASE/es_full.txt"; then
            python3 herramientas/ampliar_diccionario.py app/src/main/assets/diccionario.txt frecuencias.txt 260000 app/src/main/assets/errores.txt 12 app/src/main/assets/juntas.txt
          elif curl -fsSL -o frecuencias.txt "$BASE/es_50k.txt"; then
            python3 herramientas/ampliar_diccionario.py app/src/main/assets/diccionario.txt frecuencias.txt 50000 app/src/main/assets/errores.txt 1 app/src/main/assets/juntas.txt
          else
            echo "::warning::No se pudo descargar la lista de palabras: se usa el diccionario sin ampliar"
          fi
          rm -f frecuencias.txt

      - name: Recortar el diccionario a las palabras más usadas (menos RAM)
        run: python3 herramientas/recortar_diccionario.py app/src/main/assets 50000

      - name: Compilar los errores de fábrica (arranque instantáneo y casi sin memoria)
        run: |
          # El teclado usa errores.bin directo desde el APK; el .txt queda solo en el repositorio
          python3 herramientas/compilar_errores.py app/src/main/assets/errores.txt app/src/main/assets/errores.bin
          rm -f app/src/main/assets/errores.txt

      - name: Poner la llave de firma (desde los secretos de GitHub)
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | tr -d " \r\n" | base64 -d > app/firma.jks
            echo "Llave puesta desde los secretos"
          elif [ -f app/firma.jks ]; then
            echo "::warning::La llave sigue dentro del repositorio. Pásala a los secretos (FIRMA_BASE64) y borra app/firma.jks"
          else
            echo "::error::Falta la llave: crea el secreto FIRMA_BASE64 en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Precompilar el diccionario (arranque instantáneo al instalar o actualizar)
        # Si falla, el teclado lo arma él mismo la primera vez (como antes)
        continue-on-error: true
        env:
          GENERAR_DICCIONARIO: "1"
        run: |
          gradle testDebugUnitTest --tests com.tecladoios.GenerarDiccionarioTest --stacktrace
          ls -la app/src/main/assets/diccionario_listo.bin || true

      - name: Probar el cerebro y la autocorrección
        # Si una prueba falla, el APK se compila igual y el resultado queda para revisarlo
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar el APK
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: gradle assembleDebug --stacktrace

      - name: Subir el resultado de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-pruebas
          path: app/build/reports/tests/

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: TecladoiOS
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar la versión en Releases (para descargar el APK directo)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          VERSION="7.${{ github.run_number }}"
          cp "$APK" "TecladoiOS-$VERSION.apk"
          NOTAS="$(git log -1 --pretty=%B | head -1)"
          gh release create "v$VERSION" "TecladoiOS-$VERSION.apk" \
            --title "TecladoiOS $VERSION" --notes "$NOTAS" --target "$GITHUB_SHA" --latest
