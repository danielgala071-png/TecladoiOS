name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compilar:
    # Solo compila cuando se pide: a mano (Run workflow) o con la palabra «compilar» en el mensaje del cambio
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'compilar')
    runs-on: ubuntu-latest
    # Para publicar cada versión en "Releases"
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Quitar archivos del teclado anterior
        run: |
          # Archivos de la versión vieja que ya no existen en la nueva (si quedaron en el repo)
          cd app/src/main/java/com/tecladoios
          rm -fv Claves.kt EmojiPalabras.kt EmojiPanel.kt Formas.kt Idiomas.kt KeyPreview.kt \
            KeyboardCorners.kt Medidas.kt ModeloToque.kt Movimiento.kt Panel.kt SuggestionBar.kt Variantes.kt
          rm -fv ../../../../test/java/com/tecladoios/PortapapelesYEmojisTest.kt

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Poner la llave de firma (desde los secretos de GitHub)
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          if [ -z "$FIRMA_BASE64" ] || [ -z "$FIRMA_CLAVE" ]; then
            echo "::error::Faltan los secretos FIRMA_BASE64 y FIRMA_CLAVE (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$FIRMA_BASE64" | tr -d " \r\n" | base64 -d > app/firma.jks
          echo "Llave puesta desde los secretos"

      - name: Compilar el APK
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: gradle assembleDebug --stacktrace

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: TecladoiOS
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar la versión en Releases (para descargar el APK directo)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          VERSION="7.${{ github.run_number }}"
          cp "$APK" "TecladoiOS-$VERSION.apk"
          NOTAS="$(git log -1 --pretty=%B | head -1)"
          gh release create "v$VERSION" "TecladoiOS-$VERSION.apk" \
            --title "TecladoiOS $VERSION" --notes "$NOTAS" --target "$GITHUB_SHA" --latest
