name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descargar la fuente estilo iPhone (Inter)
        run: |
          DESTINO=app/src/main/assets/inter.ttf
          mkdir -p app/src/main/assets
          if [ ! -f "$DESTINO" ]; then
            if curl -fsSL -o inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip; then
              unzip -q -o inter.zip -d inter
              cp "$(find inter -name 'InterVariable.ttf' | head -1)" "$DESTINO" || true
            fi
            if [ ! -s "$DESTINO" ]; then
              curl -fsSL -o "$DESTINO" "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || true
            fi
          fi
          if [ ! -s "$DESTINO" ]; then
            rm -f "$DESTINO"
            echo "::warning::No se pudo descargar la fuente Inter: este APK usará la fuente del sistema"
          fi
          ls -la app/src/main/assets

      - name: Ampliar el diccionario con el español que se usa de verdad
        run: |
          # Lista completa de palabras del español conversado con su frecuencia (subtítulos).
          # Entran las que faltan (también las formales y del trabajo), en el lugar que les toca,
          # sin los errores de tipeo. Sin internet el diccionario queda como está.
          BASE=https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/es
          if curl -fsSL -o frecuencias.txt "$BASE/es_full.txt"; then
            python3 herramientas/ampliar_diccionario.py app/src/main/assets/diccionario.txt frecuencias.txt 260000 app/src/main/assets/errores.txt 12
          elif curl -fsSL -o frecuencias.txt "$BASE/es_50k.txt"; then
            python3 herramientas/ampliar_diccionario.py app/src/main/assets/diccionario.txt frecuencias.txt 50000 app/src/main/assets/errores.txt
          else
            echo "::warning::No se pudo descargar la lista de palabras: se usa el diccionario sin ampliar"
          fi
          rm -f frecuencias.txt

      - name: Poner la llave de firma (desde los secretos de GitHub)
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | tr -d " \r\n" | base64 -d > app/firma.jks
            echo "Llave puesta desde los secretos"
          elif [ -f app/firma.jks ]; then
            echo "::warning::La llave sigue dentro del repositorio. Pásala a los secretos (FIRMA_BASE64) y borra app/firma.jks"
          else
            echo "::error::Falta la llave: crea el secreto FIRMA_BASE64 en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Probar el cerebro y la autocorrección
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar el APK
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: gradle assembleDebug --stacktrace

      - name: Subir el resultado de las pruebas (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-pruebas
          path: app/build/reports/tests/

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: TecladoiOS
          path: app/build/outputs/apk/debug/*.apk
